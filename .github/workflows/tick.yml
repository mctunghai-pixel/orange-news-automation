name: Tick (external clock)

# fix25: GitHub's own cron drops most ticks for this repo (2026-11-09: Reels 0 runs,
# Market Data every ~4 h, publishers 1 of 4 attempts). cron-job.org calls this
# workflow's dispatch endpoint every 15 min; it fans out to the publishers.
# Every runner is idempotent (state files), so extra ticks never double-post.

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'   # fallback if the external clock is down

permissions:
  actions: write
  contents: read

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  fan-out:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            translated_posts.json
            logs
          sparse-checkout-cone-mode: false

      # fix32: retry window extended to 19:59 MNT — the free Gemini quota resets at
      # 16:00 MNT (midnight PT), so a morning run that died on quota can still recover.
      # fix26: on 2026-11-10 GitHub dropped the 06:13 daily-pipeline cron and all
      # Market Watch crons, so nothing new was made. The external clock now also
      # starts those two when today's output is missing (and none is running).
      - name: Start daily pipeline / Market Watch if today's run was skipped
        run: |
          H=$(TZ=Asia/Ulaanbaatar date +%H); H=$((10#$H)); M=$(TZ=Asia/Ulaanbaatar date +%M); M=$((10#$M))
          TODAY=$(TZ=Asia/Ulaanbaatar date +%F)
          GEN=$(python3 -c "import json;p=json.load(open('translated_posts.json'));print(str(p[0].get('generated_date',''))[:10])" 2>/dev/null || true)
          MWD=$(python3 -c "import json;print(json.load(open('logs/mw_published.json')).get('date',''))" 2>/dev/null || true)
          recent() {  # any run of $1 queued/running or created in the last $2 minutes?
            gh run list --workflow "$1" -L 5 --json status,createdAt \
              --jq "[.[] | select(.status!=\"completed\" or ((now - (.createdAt|fromdateiso8601)) < ($2*60)))] | length"
          }
          echo "MNT $H:$M  posts=$GEN  mw=$MWD  today=$TODAY"
          if [ "$H" -ge 6 ] && [ "$H" -le 19 ] && [ "$GEN" != "$TODAY" ] && [ "$(recent orange_news.yml 75)" = "0" ]; then
            echo "→ daily pipeline missing — dispatching"; gh workflow run orange_news.yml --ref main -f live=true || true
          fi
          # Market Watch: fb_poster_live posts live until 11:00; wait for today's posts first (fix18 reuse)
          if [ "$MWD" != "$TODAY" ] && [ "$GEN" = "$TODAY" ] && [ $((H*60+M)) -ge 465 ] && [ "$H" -lt 11 ] \
             && [ "$(recent market_watch_live.yml 45)" = "0" ]; then
            echo "→ Market Watch missing — dispatching"; gh workflow run market_watch_live.yml --ref main || true
          fi

      - name: Dispatch due publishers
        run: |
          H=$(TZ=Asia/Ulaanbaatar date +%H); H=$((10#$H))
          echo "MNT hour: $H"
          run() { echo "→ $*"; gh workflow run "$@" --ref main || echo "  ⚠️ dispatch failed: $1"; }
          # Hourly IG / Threads / Telegram slots: 08:00–17:00 (runners accept up to 19:59)
          if [ "$H" -ge 8 ] && [ "$H" -le 19 ]; then
            for wf in ig_publisher_hourly.yml threads_publisher_hourly.yml telegram_publisher_hourly.yml; do
              run "$wf" -f enable_publishing=true -f dry_run=false
            done
          fi
          # Reels slots 10:30 / 13:30 / 16:30 / 19:30 — runner posts only the earliest due one
          if [ "$H" -ge 10 ] && [ "$H" -le 22 ]; then
            run reels_publisher.yml -f dry_run=false
          fi
