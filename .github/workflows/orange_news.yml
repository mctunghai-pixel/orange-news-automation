# =============================================================================
# Orange News Daily Pipeline v7 FINAL
# =============================================================================
# Цагийн тохиргоо:
#   UTC 00:15 = Монгол цагаар 08:15
#   Pipeline 30 минут ажиллаж дуусна
#   Эхний пост (Market Watch) 09:00 Монгол цагт шууд нийтлэгдэнэ
#   Бусад постууд 10:00, 11:00, 12:00 ... 17:00
# =============================================================================

name: Orange News Daily Pipeline

on:
  schedule:
    # GitHub cron is often 1–2.5 h late (2026-10-23: 06:00 job started 08:26).
    # 04:13 MNT start keeps the first 09:00 news slot safe even with a 3 h delay.
    - cron: '13 20 * * *'

  workflow_dispatch:
    inputs:
      live:
        description: 'Publish to Facebook (false = dry-run, no FB posts)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      TZ: Asia/Ulaanbaatar
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Mongolia timezone
        run: |
          sudo timedatectl set-timezone Asia/Ulaanbaatar || true
          echo "⏰ Current time: $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mongolian fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install "anthropic>=1.0,<2" "google-genai>=1.0,<3" python-dotenv feedparser httpx certifi python-dateutil yfinance Pillow requests readability-lxml beautifulsoup4

      # -----------------------------------------------------------------
      # Phase 1: RSS цуглуулах
      # -----------------------------------------------------------------
      - name: Phase 1 - Collect RSS news
        run: |
          echo "📡 RSS collector at $(date '+%H:%M:%S %Z')"
          python3 orange_rss_collector.py

      # -----------------------------------------------------------------
      # Phase 1.5: Market Data татах (Монголбанк + Yahoo Finance)
      # -----------------------------------------------------------------
      - name: Phase 1.5 - Fetch market data
        run: |
          echo "📊 Market data fetcher at $(date '+%H:%M:%S %Z')"
          python3 market_data_fetcher.py || echo "⚠️ Market data failed - translator will use fallback"
        continue-on-error: true

      # -----------------------------------------------------------------
      # Phase 2: Gemini translator (Claude fallback) — Market Watch + орчуулга
      # -----------------------------------------------------------------
      - name: Phase 2 — Gemini translator (Claude fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🤖 Translator at $(date '+%H:%M:%S %Z')"
          python3 orange_translator.py

      # -----------------------------------------------------------------
      # Phase 2.5: Image generator
      # -----------------------------------------------------------------
      - name: Phase 2.5 - Image generator
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          echo "🎨 Image generator at $(date '+%H:%M:%S %Z')"
          python3 image_generator.py


      - name: Phase 2.6 - Publish images (media-public) + annotate URLs
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin media-public:media-public
          python3 publishers/media_pusher.py --annotate translated_posts.json
      # -----------------------------------------------------------------
      # Phase 3: Facebook poster (LIVE)
      # -----------------------------------------------------------------
      - name: Phase 3 - Facebook poster
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          echo "📘 FB poster at $(date '+%H:%M:%S %Z')"
          python3 fb_poster.py ${{ (github.event_name == 'schedule' || inputs.live == true) && '--live' || '' }}
      # -----------------------------------------------------------------
      # Phase 3.5: Archive snapshot (Phase 7.1 — daily archive writer)
      # -----------------------------------------------------------------
      - name: Phase 3.5 - Archive snapshot
        if: always()
        run: |
          echo "🗄️  Archive writer at $(date '+%H:%M:%S %Z')"
          python3 archive_writer.py --source orange_news.yml

      # ----------------------------------------------------------------
      # Phase 4: Commit translated_posts.json + archive (website feed)
      # ----------------------------------------------------------------
      - name: Phase 4 — Commit translated_posts.json + archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translated_posts.json archive/
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to translated_posts.json or archive"
          else
            git commit -m "data: update translated_posts.json + archive [skip ci]"
            git push
            echo "✅ translated_posts.json + archive committed and pushed"
          fi


      # -----------------------------------------------------------------
      # Артифакт хадгалах (debugging)
      # -----------------------------------------------------------------
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_number }}
          path: |
            top_news.json
            translated_posts.json
            assets/generated/*.png
            pipeline_log.txt
          retention-days: 7

      # -----------------------------------------------------------------
      # Phase 8.1: Slack notification on workflow failure
      # -----------------------------------------------------------------
      - name: Alert on failure (Telegram DM + optional Slack)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MSG: "🚨 ${{ github.workflow }} FAILED (${{ github.event_name }})\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          TEXT="$(printf '%b' "$MSG")"
          sent=0
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ALERT_CHAT_ID" ]; then
            curl -sS -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" > /dev/null && sent=1 && echo "Telegram alert sent"
          fi
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            jq -n --arg t "$TEXT" '{text:$t}' | curl -sS -m 20 -X POST -H 'Content-Type: application/json' \
              --data @- "$SLACK_WEBHOOK_URL" > /dev/null && sent=1 && echo "Slack alert sent"
          fi
          [ "$sent" = 1 ] || echo "::warning::No alert channel configured (set TELEGRAM_ALERT_CHAT_ID secret)"
